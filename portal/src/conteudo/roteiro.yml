# Roteiro de aprendizado (docs/pagina_de_conceitos.md §10). Cresce um degrau por vez: o Owner
# estuda o degrau e indica o assunto do próximo. A ordem dos degraus é a ordem em que ele avançou.
# Os pré-requisitos dos termos ficam no inventario.yml; a build recusa ciclo e termo que dependa de
# outro fora do roteiro ou num degrau posterior. A prática segue a regra dos exemplos (conferida
# contra o pacote fixado).

- id: fundamentos
  titulo: "Degrau 1: fundamentos"
  feito_em: "2026-11-18"
  objetivo: >-
    Ler uma tabela do projeto e dizer o que cada linha representa, que coluna identifica a linha,
    que colunas apontam para outras tabelas e onde está a descrição de cada coluna.
  introducao: |-
    Quase tudo neste portal é sobre **tabelas**. Uma tabela guarda informações sobre um tipo de
    coisa (marcas, clientes, pedidos). Cada **linha** é uma ocorrência dessa coisa, e cada
    **coluna** é uma característica dela. O portal chama tabelas e views de **relações**, como o
    projeto de dados.

    Este degrau ensina a ler uma tabela antes de fazer qualquer conta com ela: o que ela representa,
    como uma linha é identificada, o que exatamente uma linha significa e onde a descrição de cada
    parte está escrita.
  didatico:
    titulo: Uma tabela de marcas
    texto: |-
      Simplificação para ilustrar, sem dados do projeto:

      | brand_key | brand_name | brand_country |
      |---|---|---|
      | a1 | Marca Alfa | Brasil |
      | b2 | Marca Beta | Portugal |

      Cada linha é uma marca (esse é o **grão**). `brand_key` identifica a linha (é a **chave
      primária**). `brand_name` e `brand_country` descrevem a marca. A frase "cada linha é uma
      marca" e o significado de cada coluna são **metadados**, e o lugar onde eles ficam escritos é o
      **dicionário de dados**.
  termos:
    - { id: entidade-e-relacionamento, porque: "o que uma tabela representa e como as tabelas se ligam" }
    - { id: chave, porque: "como cada linha é identificada e como uma tabela aponta para outra" }
    - { id: grao, porque: "o que exatamente uma linha significa; vem antes de contar ou somar" }
    - { id: metadado, porque: "a informação sobre os dados que o portal inteiro mostra" }
    - { id: dicionario-de-dados, porque: "onde cada coluna é descrita: tipo, significado e classificação" }
  pratica:
    - { tipo: relacao, ref: analytics.dim_brand, nota: "uma tabela pequena: ache o grão, a chave primária e a chave natural" }
    - { tipo: relacao, ref: analytics.fact_cart_event, nota: "uma tabela maior: ache o grão, a chave primária e as chaves estrangeiras" }
    - { tipo: pagina, ref: "estrutura/?er=analytics.fact_cart_event#entidades", nota: "a mesma tabela no diagrama, ligada às tabelas que ela aponta" }
  perguntas:
    - Numa linha de `analytics.dim_brand`, o que está representado?
    - Que coluna identifica cada linha de `analytics.fact_cart_event`? E quais colunas apontam para outras tabelas?
    - Por que a página dessa tabela diz que algumas chaves estrangeiras são "sem teste not_null"?
    - Onde, na página de uma tabela, está a descrição de cada coluna?
- id: modelagem-dimensional
  titulo: "Degrau 2: modelagem dimensional"
  feito_em: "2026-11-20"
  objetivo: >-
    Abrir uma tabela fato e dizer que acontecimento cada linha registra, quais dimensões descrevem
    esse acontecimento, quais colunas são medidas e se cada medida pode ser somada ao agrupar por
    uma dimensão.
  introducao: |-
    No degrau 1 cada tabela foi lida sozinha. Na camada de análise do projeto (`analytics`), as
    tabelas trabalham em conjunto e têm dois papéis. A **fato** registra acontecimentos (um item
    vendido, uma remessa, um pagamento) e guarda os números deles. As **dimensões** descrevem o
    contexto desses acontecimentos: quando, o quê, por qual canal, para quem.

    A fato fica no centro e aponta para cada dimensão por uma chave estrangeira, o que forma uma
    **estrela**. Uma pergunta de negócio, como "qual a receita por mês e canal?", vira sempre a mesma
    receita: somar ou contar as linhas da fato e agrupar pelos atributos das dimensões. O cuidado
    está em saber o que pode ser somado, e isso depende do grão que você aprendeu no degrau 1.
  didatico:
    titulo: Uma pequena estrela de vendas
    texto: |-
      Simplificação para ilustrar, sem dados do projeto. A fato tem uma linha por item vendido:

      | data | produto | pedido | quantidade | valor |
      |---|---|---|---|---|
      | 03/01 | p1 | A | 2 | 40 |
      | 03/01 | p2 | A | 1 | 15 |
      | 04/01 | p1 | B | 1 | 20 |

      E uma dimensão de produto descreve cada produto:

      | produto | nome | categoria |
      |---|---|---|
      | p1 | Caneca | Cozinha |
      | p2 | Vela | Decoração |

      `data` e `produto` são chaves para as dimensões; `quantidade` e `valor` são **medidas**. Somar
      `valor` por categoria dá Cozinha 60 e Decoração 15, e a soma das categorias (75) é o total: o
      valor é **aditivo**. Já a contagem de pedidos dá Cozinha 2 (A e B) e Decoração 1 (A), mas o
      total é 2 pedidos, não 3, porque o pedido A tem itens nas duas categorias. A contagem de pedidos
      **não é aditiva** entre categorias.
  termos:
    - { id: fato, porque: "a tabela dos acontecimentos, com um grão declarado e as medidas" }
    - { id: dimensao, porque: "o contexto que descreve cada acontecimento e pelo qual se agrupa" }
    - { id: esquema-estrela, porque: "a fato no centro, ligada a cada dimensão por uma chave" }
    - { id: medida-e-metrica, porque: "o número agregado da fato e a conta feita sobre esses números" }
    - { id: aditividade, porque: "o que pode ser somado ao agrupar, e o que precisa ser recalculado" }
  pratica:
    - { tipo: relacao, ref: analytics.fact_sales_order_item, nota: "a fato: ache o grão, as medidas e as chaves que apontam para as sete dimensões no esquema estrela" }
    - { tipo: relacao, ref: analytics.dim_sales_channel, nota: "uma das dimensões da estrela: o que ela descreve e qual chave a fato usa para chegar nela" }
    - { tipo: pergunta, ref: P01, nota: "a estrela de uma pergunta: a fato, as três dimensões pelas quais agrupa e a aditividade de cada medida" }
    - { tipo: metrica, ref: average_order_value, nota: "uma métrica: a razão entre duas medidas, que não se soma" }
  perguntas:
    - Que acontecimento uma linha de `analytics.fact_sales_order_item` registra? Por que a descrição dela diz que valores de nível de pedido, como o frete, não estão ali?
    - Na P01, qual é a fato no centro da estrela e por quais dimensões a pergunta agrupa?
    - Na P01, `net_revenue_amount` é aditiva e `order_count` não é. O que a nota da origem diz sobre o motivo?
    - Por que `average_order_value` não é calculada somando valores médios, e sim dividindo `net_revenue_amount` por `order_count`?
