# Roteiro de aprendizado (docs/pagina_de_conceitos.md §10). Cresce um degrau por vez: o Owner
# estuda o degrau e indica o assunto do próximo. A ordem dos degraus é a ordem em que ele avançou.
# Os pré-requisitos dos termos ficam no inventario.yml; a build recusa ciclo e termo que dependa de
# outro fora do roteiro ou num degrau posterior. A prática segue a regra dos exemplos (conferida
# contra o pacote fixado).

- id: fundamentos
  titulo: "Degrau 1: fundamentos"
  feito_em: "2026-11-18"
  objetivo: >-
    Ler uma tabela do projeto e dizer o que cada linha representa, que coluna identifica a linha,
    que colunas apontam para outras tabelas e onde está a descrição de cada coluna.
  introducao: |-
    Quase tudo neste portal é sobre **tabelas**. Uma tabela guarda informações sobre um tipo de
    coisa (marcas, clientes, pedidos). Cada **linha** é uma ocorrência dessa coisa, e cada
    **coluna** é uma característica dela. O portal chama tabelas e views de **relações**, como o
    projeto de dados.

    Este degrau ensina a ler uma tabela antes de fazer qualquer conta com ela: o que ela representa,
    como uma linha é identificada, o que exatamente uma linha significa e onde a descrição de cada
    parte está escrita.
  didatico:
    titulo: Uma tabela de marcas
    texto: |-
      Simplificação para ilustrar, sem dados do projeto:

      | brand_key | brand_name | brand_country |
      |---|---|---|
      | a1 | Marca Alfa | Brasil |
      | b2 | Marca Beta | Portugal |

      Cada linha é uma marca (esse é o **grão**). `brand_key` identifica a linha (é a **chave
      primária**). `brand_name` e `brand_country` descrevem a marca. A frase "cada linha é uma
      marca" e o significado de cada coluna são **metadados**, e o lugar onde eles ficam escritos é o
      **dicionário de dados**.
  termos:
    - { id: entidade-e-relacionamento, porque: "o que uma tabela representa e como as tabelas se ligam" }
    - { id: chave, porque: "como cada linha é identificada e como uma tabela aponta para outra" }
    - { id: grao, porque: "o que exatamente uma linha significa; vem antes de contar ou somar" }
    - { id: metadado, porque: "a informação sobre os dados que o portal inteiro mostra" }
    - { id: dicionario-de-dados, porque: "onde cada coluna é descrita: tipo, significado e classificação" }
  pratica:
    - { tipo: relacao, ref: analytics.dim_brand, nota: "uma tabela pequena: ache o grão, a chave primária e a chave natural" }
    - { tipo: relacao, ref: analytics.fact_cart_event, nota: "uma tabela maior: ache o grão, a chave primária e as chaves estrangeiras" }
    - { tipo: pagina, ref: "estrutura/?er=analytics.fact_cart_event#entidades", nota: "a mesma tabela no diagrama, ligada às tabelas que ela aponta" }
  perguntas:
    - Numa linha de `analytics.dim_brand`, o que está representado?
    - Que coluna identifica cada linha de `analytics.fact_cart_event`? E quais colunas apontam para outras tabelas?
    - Por que a página dessa tabela diz que algumas chaves estrangeiras são "sem teste not_null"?
    - Onde, na página de uma tabela, está a descrição de cada coluna?
