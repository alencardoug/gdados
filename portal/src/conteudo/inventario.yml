# Inventário dos termos e artefatos que a interface expõe (E1; docs/pagina_de_conceitos.md §9).
#
# Cada item tem um identificador estável (o endereço /conceitos/<id>/), o grupo, os termos de busca
# (português, identificador em inglês, sigla, sinônimo) e onde a origem o define:
#   definicoes: trecho de um glossário da origem, exibido literalmente, com o commit fixado.
#               "termo" é o texto em negrito que abre o verbete ("**Grão** — …") ou a primeira
#               célula da linha de uma tabela ("| **dbt** | … |").
#   leituras:   documentos da origem que tratam do termo (caminho#âncora), só como link.
# A explicação do portal, quando existe, está em conceitos/<id>.md. Sem ela, a página do termo
# mostra as definições da origem e marca a explicação do portal como pendente.
# Nenhuma contagem ou identificador do pacote é fixado aqui (D03).

