# Valida, testa e constrói o portal em todo PR e push; publica no Firebase Hosting (site
# `governadados`) só no push para o `main`, depois do build. Sem chave: OIDC do GitHub -> federação de
# identidade (o provider aceita só este repositório, o `main` e o push) -> conta de serviço com
# roles/firebasehosting.admin no projeto "Extras", que não tem conta de faturamento (D04).
# Modelo: o deploy do Linkedia. Actions fixadas por SHA (tag no comentário); atualizar de propósito.
name: Build e deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Instalar
        working-directory: portal
        run: npm ci --no-audit --no-fund
      - name: Validar a cópia da origem (D03)
        working-directory: portal
        run: npm run validar
      - name: Testes
        working-directory: portal
        run: npm test
      - name: Build
        working-directory: portal
        run: npm run build
      - name: Verificações estáticas da E3
        working-directory: verificacao
        run: node estatica_ci.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: portal/dist
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://governadados.web.app
    permissions:
      contents: read
      id-token: write # token OIDC para a federação de identidade; só este job o recebe
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            firebase.json
            .firebaserc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: portal/dist
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/444903248377/locations/global/workloadIdentityPools/github/providers/gdados
          service_account: github-deploy@extras-douglas-alencar.iam.gserviceaccount.com
      - run: npx --yes firebase-tools@15.34.0 deploy --only hosting:governadados --project extras-douglas-alencar --non-interactive
      - name: Teste de fumaça
        run: |
          curl -fsS --retry 5 --retry-delay 5 https://governadados.web.app/ -o inicio.html
          grep -q '<html lang="pt-BR"' inicio.html
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null https://governadados.web.app/conceitos/
